<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000"/>
      <stop offset="100%" style="stop-color:#001122"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="50%" style="stop-color:#1e5a8a"/>
      <stop offset="100%" style="stop-color:#2a7ab8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b00"/>
      <stop offset="100%" style="stop-color:#cc4400"/>
    </linearGradient>
    <filter id="dashShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f5f5f0"/>
  <g filter="url(#dashShadow)">
    <!-- Camera body -->
    <rect x="100" y="100" width="200" height="120" rx="12" fill="url(#bodyGrad)" stroke="#000" stroke-width="1"/>
    <!-- Screen -->
    <rect x="115" y="115" width="170" height="90" rx="8" fill="url(#screenGrad)" stroke="#111" stroke-width="1"/>
    <!-- Screen content -->
    <rect x="120" y="120" width="160" height="80" rx="4" fill="#001122"/>
    <text x="200" y="160" text-anchor="middle" font-family="system-ui" font-size="24" font-weight="bold" fill="#00aaff">REC</text>
    <text x="200" y="185" text-anchor="middle" font-family="system-ui" font-size="12" fill="#888">00:15:32</text>
    <!-- Camera lens -->
    <g transform="translate(320, 155)">
      <circle cx="0" cy="0" r="35" fill="url(#lensGrad)" stroke="#0a2a4a" stroke-width="1"/>
      <circle cx="0" cy="0" r="28" fill="#0a1a2a"/>
      <circle cx="0" cy="0" r="20" fill="#001122"/>
      <circle cx="0" cy="0" r="12" fill="#003355" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="6" fill="#00ffff" opacity="0.8" filter="url(#glow)"/>
    </g>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Mount bracket -->
    <path d="M300,140 L300,120 Q300,100 280,90 Q260,90 250,120 L250,140 Z" fill="#222" stroke="#111" stroke-width="1"/>
    <rect x="255" y="130" width="30" height="15" rx="3" fill="#333"/>
    <!-- Buttons -->
    <circle cx="130" cy="190" r="15" fill="#222" stroke="#333" stroke-width="1"/>
    <text x="130" y="195" text-anchor="middle" font-size="10" fill="#ff6b00">REC</circle>
    <circle cx="170" cy="190" r="15" fill="#222" stroke="#333" stroke-width="1"/>
    <text x="170" y="195" text-anchor="middle" font-size="10" fill="#44aaff">MENU</circle>
    <circle cx="210" cy="190" r="15" fill="#222" stroke="#333" stroke-width="1"/>
    <text x="210" y="195" text-anchor="middle" font-size="10" fill="#88cc00">OK</circle>
    <!-- Mount suction cup -->
    <ellipse cx="200" cy="240" rx="40" ry="15" fill="#1a1a1a" stroke="#111" stroke-width="1"/>
    <ellipse cx="200" cy="240" rx="30" ry="10" fill="#0d0d0d"/>
    <circle cx="200" cy="240" r="15" fill="#001122"/>
  </g>
  <!-- Brand & specs -->
  <text x="200" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#111">70mai</text>
  <text x="200" y="355" text-anchor="middle" font-size="14" fill="#666">4K WiFi Dash Cam with GPS</text>
  <text x="200" y="375" text-anchor="middle" font-size="12" fill="#888">4K 30fps • 170° FOV • Night Vision</text>
</svg>
