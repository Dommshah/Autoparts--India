<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rotorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="50%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#555"/>
      <stop offset="100%" style="stop-color:#333"/>
    </linearGradient>
    <linearGradient id="ventGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#222"/>
      <stop offset="100%" style="stop-color:#111"/>
    </linearGradient>
    <filter id="rotorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f5f5f0"/>
  <g filter="url(#rotorShadow)">
    <!-- Rotor hat -->
    <circle cx="200" cy="180" r="90" fill="url(#hatGrad)" stroke="#222" stroke-width="1"/>
    <circle cx="200" cy="180" r="75" fill="url(#ventGrad)"/>
    <!-- Vent holes -->
    <g fill="#111" opacity="0.9">
      <circle cx="200" cy="120" r="4"/>
      <circle cx="250" cy="130" r="4"/>
      <circle cx="280" cy="150" r="4"/>
      <circle cx="300" cy="180" r="4"/>
      <circle cx="300" cy="220" r="4"/>
      <circle cx="280" cy="250" r="4"/>
      <circle cx="250" cy="270" r="4"/>
      <circle cx="200" cy="280" r="4"/>
      <circle cx="150" cy="270" r="4"/>
      <circle cx="150" cy="220" r="4"/>
      <circle cx="120" cy="180" r="4"/>
      <circle cx="120" cy="150" r="4"/>
      <circle cx="150" cy="140" r="4"/>
    </g>
    <!-- Center hub -->
    <circle cx="200" cy="180" r="35" fill="#333" stroke="#222" stroke-width="1"/>
    <circle cx="200" cy="180" r="20" fill="#222"/>
    <circle cx="200" cy="180" r="8" fill="#111"/>
    <!-- Bolt holes -->
    <g fill="#222" stroke="#111" stroke-width="0.5">
      <circle cx="170" cy="150" r="6"/>
      <circle cx="230" cy="150" r="6"/>
      <circle cx="230" cy="210" r="6"/>
      <circle cx="170" cy="210" r="6"/>
      <circle cx="155" cy="180" r="6"/>
      <circle cx="245" cy="180" r="6"/>
    </g>
    <!-- Friction surface (vented rotor) -->
    <g stroke="#222" stroke-width="0.5" opacity="0.5">
      <circle cx="200" cy="180" r="60"/>
      <circle cx="200" cy="180" r="65"/>
      <circle cx="200" cy="180" r="70"/>
      <circle cx="200" cy="180" r="75"/>
      <circle cx="200" cy="180" r="80"/>
      <circle cx="200" cy="180" r="85"/>
    </g>
    <!-- Vanes (visible through vents) -->
    <g stroke="#1a1a1a" stroke-width="1.5" opacity="0.6">
      <line x1="160" y1="180" x2="240" y2="180"/>
      <line x1="165" y1="160" x2="235" y2="180"/>
      <line x1="170" y1="140" x2="230" y2="200"/>
      <line x1="175" y1="120" x2="225" y2="220"/>
      <line x1="180" y1="100" x2="220" y2="240"/>
      <line x1="185" y1="80" x2="215" y2="260"/>
    </g>
  </g>
  <text x="200" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2a2a2a">BREMBO</text>
  <text x="200" y="355" text-anchor="middle" font-size="14" fill="#666">Disc Brake Rotor - Front Pair</text>
  <text x="200" y="375" text-anchor="middle" font-size="12" fill="#888">High Carbon Iron • Vented • 280mm</text>
</svg>
