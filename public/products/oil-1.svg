<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a"/>
      <stop offset="30%" style="stop-color:#1e5a3a"/>
      <stop offset="70%" style="stop-color:#2a7a4a"/>
      <stop offset="100%" style="stop-color:#3a9a5a"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b00"/>
      <stop offset="100%" style="stop-color:#cc4400"/>
    </linearGradient>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffb300"/>
      <stop offset="100%" style="stop-color:#cc8800"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <filter id="bottleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f5f5f0"/>
  <!-- Bottle shadow -->
  <ellipse cx="200" cy="370" rx="80" ry="15" fill="#000" opacity="0.15"/>
  <!-- Bottle body -->
  <g filter="url(#bottleShadow)">
    <path d="M140 80 L140 320 Q140 340 160 340 L240 340 Q260 340 260 320 L260 80 Q260 60 240 60 L160 60 Q140 60 140 80 Z" fill="url(#bottleGrad)" stroke="#0d4020" stroke-width="1"/>
    <!-- Oil fill -->
    <path d="M150 150 L150 320 Q150 330 165 330 L235 330 Q250 330 250 320 L250 150 Z" fill="url(#oilGrad)" opacity="0.9"/>
    <!-- Label area -->
    <rect x="160" y="120" width="80" height="120" rx="8" fill="url(#labelGrad)" stroke="#ddd" stroke-width="1"/>
    <!-- Brand -->
    <text x="200" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1a3a2a">MOBIL</text>
    <text x="200" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ff6b00">1</text>
    <!-- Specs -->
    <text x="200" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1a3a2a">5W-40</text>
    <text x="200" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#555">Fully Synthetic</text>
    <text x="200" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#555">5 Liters</text>
    <!-- API badges -->
    <rect x="170" y="260" width="60" height="20" rx="4" fill="#ff6b00"/>
    <text x="200" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">API SN+</text>
    <rect x="230" y="260" width="60" height="20" rx="4" fill="#1a3a2a"/>
    <text x="260" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">ACEA C3</text>
  </g>
  <!-- Cap -->
  <g filter="url(#bottleShadow)">
    <rect x="180" y="45" width="40" height="35" rx="3" fill="url(#capGrad)"/>
    <rect x="185" y="50" width="30" height="20" rx="2" fill="#ff8c00" opacity="0.5"/>
  </g>
  <!-- Brand text -->
  <text x="200" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2d2d2d">MOBIL 1</text>
  <text x="200" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888">Synthetic Engine Oil 5W-40 (5L)</text>
</svg>
