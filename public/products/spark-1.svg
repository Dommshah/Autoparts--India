<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="50%" style="stop-color:#f0f0f0"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="50%" style="stop-color:#a0a0a0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
    <linearGradient id="threadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b0b0b0"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
    <linearGradient id="tipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <filter id="plugShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f5f5f0"/>
  <g filter="url(#plugShadow)">
    <!-- Terminal nut -->
    <g transform="translate(200, 60)">
      <ellipse cx="0" cy="0" rx="18" ry="6" fill="#c0c0c0" stroke="#aaa" stroke-width="0.5"/>
      <ellipse cx="0" cy="0" rx="12" ry="4" fill="#e0e0e0"/>
    </g>
    <!-- Center electrode (white ceramic) -->
    <g transform="translate(200, 80)" filter="url(#plugShadow)">
      <rect x="-8" y="0" width="16" height="120" rx="3" fill="url(#ceramicGrad)" stroke="#ddd" stroke-width="0.5"/>
      <rect x="-4" y="10" width="8" height="100" rx="1" fill="#fff" opacity="0.9"/>
    </g>
    <!-- Metal shell -->
    <g transform="translate(200, 200)" filter="url(#plugShadow)">
      <rect x="-14" y="0" width="28" height="100" rx="4" fill="url(#metalGrad)" stroke="#999" stroke-width="0.5"/>
      <!-- Threads -->
      <g stroke="#999" stroke-width="1">
        <line x1="-14" y1="20" x2="14" y2="20"/>
        <line x1="-14" y1="40" x2="14" y2="40"/>
        <line x1="-14" y1="60" x2="14" y2="60"/>
        <line x1="-14" y1="80" x2="14" y2="80"/>
      </g>
      <!-- Ground electrode -->
      <path d="M14,90 Q28,85 30,75" stroke="url(#metalGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Center electrode tip (Iridium) -->
    <circle cx="200" cy="178" r="2.5" fill="url(#tipGrad)" stroke="#b8860b" stroke-width="0.5" filter="url(#plugShadow)"/>
    <!-- Gasket -->
    <ellipse cx="200" cy="198" rx="16" ry="3" fill="#c0c0c0" stroke="#999" stroke-width="0.5" opacity="0.8"/>
  </g>
  <!-- Brand & specs -->
  <text x="200" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2d2d2d">NGK</text>
  <text x="200" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#666">Iridium IX Spark Plug</text>
  <text x="200" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#888">Pack of 4 • M14x1.25 • 26.5mm Reach</text>
</svg>
