<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="battBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="50%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#050505"/>
    </linearGradient>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="50%" style="stop-color:#a0a0a0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
    <linearGradient id="redTerminal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#cc0000"/>
    </linearGradient>
    <linearGradient id="blueTerminal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4444ff"/>
      <stop offset="100%" style="stop-color:#0000cc"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="100%" style="stop-color:#eee"/>
    </linearGradient>
    <filter id="battShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f5f5f0"/>
  <g filter="url(#battShadow)">
    <!-- Battery body -->
    <rect x="100" y="60" width="200" height="260" rx="8" fill="url(#battBody)" stroke="#000" stroke-width="1"/>
    <!-- Terminal posts -->
    <!-- Positive (red) -->
    <g transform="translate(150, 50)">
      <ellipse cx="0" cy="0" rx="22" ry="8" fill="#222" stroke="#111" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="16" ry="5" fill="url(#redTerminal)"/>
      <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#fff">+</text>
    </g>
    <!-- Negative (blue) -->
    <g transform="translate(250, 50)">
      <ellipse cx="0" cy="0" rx="22" ry="8" fill="#222" stroke="#111" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="16" ry="5" fill="url(#blueTerminal)"/>
      <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#fff">−</text>
    </g>
    <!-- Vent caps -->
    <g fill="#0a0a0a" stroke="#111" stroke-width="0.5">
      <ellipse cx="140" cy="70" rx="10" ry="5"/>
      <ellipse cx="180" cy="70" rx="10" ry="5"/>
      <ellipse cx="220" cy="70" rx="10" ry="5"/>
      <ellipse cx="260" cy="70" rx="10" ry="5"/>
      <ellipse cx="140" cy="280" rx="10" ry="5"/>
      <ellipse cx="180" cy="280" rx="10" ry="5"/>
      <ellipse cx="220" cy="280" rx="10" ry="5"/>
      <ellipse cx="260" cy="280" rx="10" ry="5"/>
    </g>
    <!-- Handle -->
    <path d="M130,50 Q130,30 150,20 Q170,20 190,30 Q190,50 170,70" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M270,50 Q270,30 250,20 Q230,20 210,30 Q210,50 230,70" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <!-- Label area -->
    <rect x="120" y="100" width="160" height="180" rx="8" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <text x="200" y="130" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="bold" fill="#000">EXIDE</text>
    <text x="200" y="160" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#c00">AMG</text>
    <text x="200" y="190" text-anchor="middle" font-family="system-ui" font-size="14" fill="#333">Performance Battery</text>
    <text x="200" y="215" text-anchor="middle" font-family="system-ui" font-size="13" fill="#555">72Ah • 12V</text>
    <text x="200" y="235" text-anchor="middle" font-family="system-ui" font-size="12" fill="#555">Lead-Calcium Technology</text>
    <rect x="150" y="255" width="100" height="25" rx="4" fill="#c00"/>
    <text x="200" y="272" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#fff">48 MONTH WARRANTY</text>
  </g>
  <text x="200" y="350" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="bold" fill="#111">EXIDE</text>
  <text x="200" y="375" text-anchor="middle" font-size="12" fill="#888">AMG Performance Battery 72Ah</text>
</svg>
