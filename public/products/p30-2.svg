<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="50%" style="stop-color:#050505"/>
      <stop offset="100%" style="stop-color:#030303"/>
    </linearGradient>
    <linearGradient id="capGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc00"/>
      <stop offset="100%" style="stop-color:#cc9900"/>
    </linearGradient>
    <linearGradient id="batteryGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
    <filter id="jumpShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f5f5f0"/>
  <g filter="url(#jumpShadow2)">
    <rect x="60" y="80" width="280" height="180" rx="12" fill="url(#bodyGrad2)" stroke="#000" stroke-width="1"/>
    <rect x="75" y="95" width="250" height="30" rx="4" fill="#111" stroke="#000" stroke-width="1"/>
    <rect x="75" y="95" width="250" height="30" rx="4" fill="#00aa44"/>
    <text x="200" y="117" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#000">FULLY CHARGED</text>
    <rect x="150" y="140" width="100" height="35" rx="6" fill="#111" stroke="#000" stroke-width="1"/>
    <rect x="158" y="144" width="84" height="27" rx="4" fill="#000"/>
    <text x="200" y="163" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="bold" fill="#ffcc00">USB-C PD 60W</text>
    <g fill="#111" stroke="#000" stroke-width="1">
      <rect x="80" y="140" width="55" height="25" rx="4"/>
      <rect x="265" y="140" width="55" height="25" rx="4"/>
    </g>
    <text x="107" y="157" text-anchor="middle" font-family="system-ui" font-size="10" fill="#888">USB-A</text>
    <text x="292" y="157" text-anchor="middle" font-family="system-ui" font-size="10" fill="#888">USB-A</text>
    <rect x="170" y="200" width="60" height="60" rx="10" fill="#111" stroke="#000" stroke-width="1"/>
    <circle cx="200" cy="230" r="15" fill="#fff" opacity="0.9" filter="url(#lightGlow)"/>
    <circle cx="200" cy="230" r="10" fill="#ffff00" opacity="0.8"/>
    <filter id="lightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g transform="translate(60, 300)">
      <rect x="0" y="0" width="80" height="40" rx="6" fill="#111" stroke="#000" stroke-width="1"/>
      <rect x="5" y="5" width="70" height="30" rx="4" fill="#c00"/>
      <text x="40" y="26" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#fff">+</text>
    </g>
    <g transform="translate(260, 300)">
      <rect x="0" y="0" width="80" height="40" rx="6" fill="#111" stroke="#000" stroke-width="1"/>
      <rect x="5" y="5" width="70" height="30" rx="4" fill="#008800"/>
      <text x="40" y="26" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="bold" fill="#fff">−</text>
    </g>
    <rect x="120" y="325" width="160" height="15" rx="4" fill="#111" stroke="#000" stroke-width="1"/>
    <rect x="120" y="325" width="160" height="15" rx="4" fill="#00cc44"/>
    <text x="200" y="335" text-anchor="middle" font-family="system-ui" font-size="10" fill="#fff">100%</text>
  </g>
  <text x="200" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#111">NOCO</text>
  <text x="200" y="355" text-anchor="middle" font-size="14" fill="#666">Lithium Jump Starter 1500A</text>
  <text x="200" y="375" text-anchor="middle" font-size="12" fill="#888">USB-C PD 45W • Power Bank • LED Light</text>
</svg>
