<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="housingGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a"/>
      <stop offset="100%" style="stop-color:#222"/>
    </linearGradient>
    <linearGradient id="lensGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff" stop-opacity="0.1"/>
      <stop offset="50%" style="stop-color:#fff" stop-opacity="0.3"/>
      <stop offset="100%" style="stop-color:#fff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="reflectorGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d0d0d0"/>
      <stop offset="50%" style="stop-color:#fff"/>
      <stop offset="100%" style="stop-color:#d0d0d0"/>
    </linearGradient>
    <linearGradient id="ledGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="50%" style="stop-color:#e8f0ff"/>
      <stop offset="100%" style="stop-color:#b0d0ff"/>
    </linearGradient>
    <filter id="hlShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f5f5f0"/>
  <g filter="url(#hlShadow2)">
    <path d="M80,100 Q70,100 70,130 L70,280 Q70,310 100,330 Q150,350 200,350 Q250,350 290,330 Q320,310 320,280 L320,130 Q320,100 310,85 Q280,70 250,70 Q200,70 170,85 Q150,85 130,100 Z" fill="url(#housingGrad2)" stroke="#111" stroke-width="1"/>
    <path d="M90,115 Q85,115 85,135 L85,270 Q85,285 100,295 Q150,310 200,310 Q250,310 290,295 Q305,285 305,270 L305,135 Q305,115 295,105 Q270,95 250,95 Q200,95 170,85 Q150,95 130,115 Z" fill="url(#lensGrad2)" stroke="#333" stroke-width="0.5" opacity="0.9"/>
    <ellipse cx="200" cy="180" rx="90" ry="50" fill="url(#reflectorGrad2)" stroke="#ccc" stroke-width="0.5"/>
    <g filter="url(#glow2)">
      <g fill="#fff">
        <rect x="130" y="155" width="18" height="18" rx="3"/>
        <rect x="160" y="155" width="18" height="18" rx="3"/>
        <rect x="190" y="155" width="18" height="18" rx="3"/>
        <rect x="220" y="155" width="18" height="18" rx="3"/>
      </g>
      <rect x="110" y="125" width="180" height="6" rx="3" fill="#fff" opacity="0.8"/>
      <rect x="110" y="255" width="180" height="4" rx="2" fill="#fff" opacity="0.5"/>
    </g>
    <rect x="270" y="160" width="25" height="50" rx="4" fill="#ff8800" opacity="0.9"/>
    <g stroke="#333" stroke-width="0.5" opacity="0.4">
      <line x1="110" y1="220" x2="290" y2="220"/>
      <line x1="110" y1="240" x2="290" y2="240"/>
      <line x1="110" y1="260" x2="290" y2="260"/>
    </g>
    <rect x="60" y="180" width="20" height="40" rx="3" fill="#333" stroke="#111" stroke-width="1"/>
    <rect x="320" y="180" width="20" height="40" rx="3" fill="#333" stroke="#111" stroke-width="1"/>
  </g>
  <text x="200" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#222">OSRAM</text>
  <text x="200" y="355" text-anchor="middle" font-size="14" fill="#666">LED Headlight Kit H4</text>
  <text x="200" y="375" text-anchor="middle" font-size="12" fill="#888">6000K • 12000LM • CANBUS Ready</text>
</svg>
