<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="50%" style="stop-color:#2d2d2d"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c56d"/>
      <stop offset="50%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#f5f5f0"/>
  <g filter="url(#shadow)">
    <rect x="80" y="180" width="240" height="80" rx="8" fill="url(#metalGrad)"/>
    <rect x="90" y="190" width="220" height="15" rx="4" fill="#3a3a3a"/>
    <rect x="90" y="215" width="220" height="15" rx="4" fill="#3a3a3a"/>
    <rect x="90" y="240" width="220" height="15" rx="4" fill="#3a3a3a"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="80" y="100" width="240" height="80" rx="8" fill="url(#ceramicGrad)"/>
    <g stroke="#b8860b" stroke-width="0.5" opacity="0.6">
      <line x1="90" y1="110" x2="310" y2="110"/>
      <line x1="90" y1="125" x2="310" y2="125"/>
      <line x1="90" y1="140" x2="310" y2="140"/>
      <line x1="90" y1="155" x2="310" y2="155"/>
    </g>
  </g>
  <rect x="140" y="110" width="25" height="60" rx="3" fill="#1a1a1a" opacity="0.8"/>
  <rect x="235" y="110" width="25" height="60" rx="3" fill="#1a1a1a" opacity="0.8"/>
  <polygon points="80,100 100,100 80,120" fill="url(#ceramicGrad)" opacity="0.9"/>
  <polygon points="320,100 300,100 320,120" fill="url(#ceramicGrad)" opacity="0.9"/>
  <polygon points="80,180 100,180 80,160" fill="url(#ceramicGrad)" opacity="0.9"/>
  <polygon points="320,180 300,180 320,160" fill="url(#ceramicGrad)" opacity="0.9"/>
  <text x="200" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2d2d2d">BREMBO</text>
  <text x="200" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#666">Ceramic Brake Pad Set - Front</text>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#888">
    <text x="200" y="365" text-anchor="middle">Ceramic Compound • Low Dust • Quiet Operation</text>
    <text x="200" y="380" text-anchor="middle">Fits: Swift, i20, Nexon, City</text>
  </g>
